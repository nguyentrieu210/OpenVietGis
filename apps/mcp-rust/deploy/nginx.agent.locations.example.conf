# Wave 3 candidate only; do not apply before qualification.
# /mcp and /ai-copilot/sessions must point to the SAME native Rust process (9188).
# The legacy 9187 relay has a different in-memory session store.
location ^~ /ai-copilot/agent/ {
    limit_req zone=ovg_mcp_browser burst=12 nodelay;
    proxy_pass http://127.0.0.1:9188;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_next_upstream off;
    proxy_buffering off;
    proxy_read_timeout 310s;
    client_max_body_size 128k;
    access_log off;
}
