[package]
name = "openvietgis-api-rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "openvietgis-api-rust"
path = "src/main.rs"

[features]
default = ["house-numbering"]
e11-candidate = []
house-numbering = ["dep:ovg-module-house-numbering"]

[dependencies]
axum.workspace = true
base64.workspace = true
chrono.workspace = true
futures-util = { version = "0.3", default-features = false }
hmac.workspace = true
http.workspace = true
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
ovg-core.workspace = true
ovg-module-house-numbering = { workspace = true, optional = true }
ovg-module-sdk.workspace = true
ovg-processing.workspace = true
ovg-spatial.workspace = true
ovg-storage.workspace = true
ovg-sync.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1 = "0.10"
sha2.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
