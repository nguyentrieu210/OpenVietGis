[package]
name = "openvietgis-api-rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "openvietgis-api-rust"
path = "src/main.rs"

[features]
default = ["house-numbering"]
house-numbering = ["dep:ovg-module-house-numbering"]

[dependencies]
axum.workspace = true
base64.workspace = true
chrono.workspace = true
hmac.workspace = true
http.workspace = true
ovg-core.workspace = true
ovg-module-house-numbering = { workspace = true, optional = true }
ovg-module-sdk.workspace = true
ovg-processing.workspace = true
ovg-spatial.workspace = true
ovg-storage.workspace = true
ovg-sync.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
