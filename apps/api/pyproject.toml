[project]
name = "openvietgis-api"
version = "0.0.0"
description = "OpenVietGIS application API"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.20.1",
  "authlib==1.9.8",
  "cryptography==50.0.2",
  "ezdxf>=1.4.5",
  "fastapi==0.163.1",
  "itsdangerous==2.2.0",
  "pillow>=13.0.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.10",
  "pyshp>=3.1.9",
  "python-multipart>=0.0.34",
  "sqlalchemy==2.1.9",
  "uvicorn[standard]>=0.38",
]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "mypy>=1.18",
  "openapi-spec-validator==0.9.0",
  "pytest>=8.4",
  "pyyaml>=6.0",
  "ruff>=0.14",
  "testcontainers[postgres]==4.15.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openvietgis_api"]

[tool.uv]
package = true

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["../.."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
exclude = ["migrations/"]
