# Review and add inside canonical HTTPS GIS server only after release gates.
# Rate-limit zones are defined in HTTP scope, not in this file.
# These paths are deliberately not enabled by the candidate.
location = /mcp {
    limit_req zone=ovg_mcp_api burst=10 nodelay;
    proxy_pass http://127.0.0.1:9187;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 60s;
    client_max_body_size 128k;
    access_log off;
}
location = /.well-known/oauth-protected-resource/mcp {
    proxy_pass http://127.0.0.1:9187;
    proxy_set_header Host $host;
    access_log off;
}
# Public MCP clients use exact callbacks, PKCE and no client secret.
# Preserve Keycloak's native OpenID discovery for non-MCP clients.
location = /.well-known/oauth-authorization-server/realms/openvietgis {
    default_type application/json;
    add_header Cache-Control "no-store";
    return 200 '{"issuer":"https://openvietgis.cloud/realms/openvietgis","authorization_endpoint":"https://openvietgis.cloud/realms/openvietgis/protocol/openid-connect/auth","token_endpoint":"https://openvietgis.cloud/realms/openvietgis/protocol/openid-connect/token","jwks_uri":"https://openvietgis.cloud/realms/openvietgis/protocol/openid-connect/certs","authorization_response_iss_parameter_supported":true,"response_types_supported":["code"],"grant_types_supported":["authorization_code","refresh_token"],"token_endpoint_auth_methods_supported":["none","client_secret_basic","client_secret_post","private_key_jwt","tls_client_auth","client_secret_jwt"],"code_challenge_methods_supported":["S256"],"scopes_supported":["openid","gis:live"]}';
    access_log off;
}
location ^~ /ai-copilot/sessions {
    limit_req zone=ovg_mcp_browser burst=12 nodelay;
    proxy_pass http://127.0.0.1:9187;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 15s;
    client_max_body_size 128k;
    access_log off;
}
