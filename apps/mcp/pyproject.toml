[project]
name = "openvietgis-mcp"
version = "0.1.0"
description = "Scoped read-only MCP adapter for OpenVietGIS"
requires-python = ">=3.13,<3.14"
dependencies = ["mcp>=2,<3", "httpx>=0.28,<1", "pyjwt[crypto]>=2.10,<3", "starlette>=1,<2", "uvicorn>=0.38,<1"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false
