openapi: "3.1.0"
info:
  title: "OpenVietGIS Integration Hub and Policy Gate API"
  version: "0.26.0"
  description: "R026 authenticated, project-scoped integration hub catalog, read-only adapter exports (GeoPackage, GeoJSON, external PostGIS SQL, AutoCAD DXF), and controlled two-step GeoPackage changeset sync (preview + explicit push via R006). Policy evaluations are descriptive preflights only, never execution tokens or credential grants. Default write policy remains deny, deletions are blocked by default, and R010 (external-sources) / R025 (MicroStation V8i separate branch) boundaries are preserved."
servers: [{"url":"/api/v1"}]
paths:
  "/organizations/{organization_id}/projects/{project_id}/integration-hub/catalog":
    get:
      operationId: "getIntegrationHubCatalog"
      x-required-permission: "project.read"
      description: "Read project-scoped integration adapter catalog with fail-closed policy preflight evaluations. Enforces PostgreSQL RLS, R002 effective permissions (including service principal credential ceiling), and project GIS ACL guard."
      security: [{"sessionCookie":[]},{"serviceBearer":[]}]
      parameters:
        - {"$ref":"#/components/parameters/OrganizationId"}
        - {"$ref":"#/components/parameters/ProjectId"}
      responses:
        "200":
          description: "Successful authorized read-only catalog inspection."
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/IntegrationHubCatalogResponse"}}}
        "401":
          description: "Authentication/credential missing or invalid."
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/R002Error"}}}
        "403":
          description: "R002 current authorization, lifecycle, service principal ceiling, or scoped GIS access denial; generic to inaccessible target."
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/R002Error"}}}
        "404":
          description: "Scoped organization or project missing, retired, hidden, or wrong owner; no private details."
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/R002Error"}}}
        "422":
          description: "Invalid path or request parameters; validation never echoes raw input."
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/RequestValidationError"}}}
  "/organizations/{organization_id}/projects/{project_id}/integration-hub/adapters/{adapter_key}":
    get:
      operationId: "getIntegrationHubAdapterProfile"
      x-required-permission: "project.read"
      description: "Read-only profile for a single registered adapter, including non-secret exchange profile metadata and per-layer ACL-filtered descriptors. Never exposes internal database credentials, vendor secrets, or write capabilities."
      security: [{"sessionCookie":[]},{"serviceBearer":[]}]
      parameters:
        - {"$ref":"#/components/parameters/OrganizationId"}
        - {"$ref":"#/components/parameters/ProjectId"}
        - {"$ref":"#/components/parameters/AdapterKey"}
      responses:
        "200":
          description: "Successful authorized read-only adapter profile inspection."
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/AdapterProfileResponse"}}}
        "401":
          description: "Authentication/credential missing or invalid."
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/R002Error"}}}
        "403":
          description: "R002 current authorization, lifecycle, service principal ceiling, or scoped GIS access denial; generic to inaccessible target."
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/R002Error"}}}
        "404":
          description: "Scoped organization, project, or adapter key missing, hidden, or wrong owner; no private details."
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/R002Error"}}}
        "422":
          description: "Invalid path or request parameters; validation never echoes raw input."
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/RequestValidationError"}}}
  "/organizations/{organization_id}/projects/{project_id}/integration-hub/adapters/{adapter_key}/layers/{layer_id}/export":
    get:
      operationId: "exportIntegrationHubLayer"
      x-required-permission: "project.read"
      description: "Read-only export of a single authorized, ready project layer in GeoPackage (.gpkg), GeoJSON (.geojson), external PostGIS SQL (.sql), or AutoCAD DXF (.dxf) format. Enforces PostgreSQL RLS, R002 effective permissions and service principal ceilings, project GIS ACL (per-layer and per-feature), and R003 explicit readable CRS rules. Never exposes internal database credentials or default write capabilities."
      security: [{"sessionCookie":[]},{"serviceBearer":[]}]
      parameters:
        - {"$ref":"#/components/parameters/OrganizationId"}
        - {"$ref":"#/components/parameters/ProjectId"}
        - {"$ref":"#/components/parameters/AdapterKey"}
        - {"$ref":"#/components/parameters/LayerId"}
        - name: "format"
          in: "query"
          required: false
          description: "Read-only snapshot exchange format."
          schema:
            type: "string"
            enum: ["geopackage","geojson","postgis_sql","dxf"]
            default: "geopackage"
      responses:
        "200":
          description: "Successful authorized read-only layer export payload with integrity and revision metadata headers."
          headers:
            Cache-Control:
              required: true
              description: "Always no-store to prevent caching of authorized GIS payloads."
              schema: {"type":"string","const":"no-store"}
            Content-Disposition:
              required: true
              description: "Attachment header carrying a sanitized export filename."
              schema: {"type":"string","minLength":1,"maxLength":255}
            X-Content-SHA256:
              required: true
              description: "Lowercase hex SHA-256 digest of the exact response body bytes."
              schema: {"type":"string","pattern":"^[a-f0-9]{64}$"}
            X-OpenVietGIS-CRS:
              required: true
              description: "Explicit verified EPSG identifier of the exported geometries (e.g. EPSG:4326, EPSG:4756, EPSG:5899)."
              schema: {"type":"string","pattern":"^EPSG:[0-9]+$"}
            X-OpenVietGIS-Content-Revision:
              required: true
              description: "SHA-256 content_revision pinned at export time."
              schema: {"type":"string","pattern":"^[a-f0-9]{64}$"}
            X-OpenVietGIS-Schema-Revision:
              required: true
              description: "SHA-256 schema_revision pinned at export time."
              schema: {"type":"string","pattern":"^[a-f0-9]{64}$"}
            X-OpenVietGIS-Feature-Count:
              required: true
              description: "Exact number of features included in the exported snapshot after ACL filtering."
              schema: {"type":"integer","minimum":0}
            X-OpenVietGIS-Attribute-Loss:
              required: false
              description: "Optional warning header set to 'true' for CAD exchange formats such as DXF whose modelspace entities do not store tabular GIS attributes."
              schema: {"type":"string","const":"true"}
          content:
            application/geopackage+sqlite3:
              schema: {"type":"string","format":"binary"}
            application/geo+json:
              schema: {"type":"object"}
            application/sql:
              schema: {"type":"string"}
            application/dxf:
              schema: {"type":"string"}
        "401":
          description: "Authentication/credential missing or invalid."
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/R002Error"}}}
        "403":
          description: "R002 current authorization, lifecycle, service principal ceiling, or scoped GIS export ACL denial; generic to inaccessible target."
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/R002Error"}}}
        "404":
          description: "Scoped organization, project, adapter key, or layer missing, retired, hidden, or wrong owner; no private details."
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/R002Error"}}}
        "409":
          description: "Layer is not ready for export, lacks an explicit R003 readable CRS, exceeds export bounds, or the adapter does not support direct read-only export."
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/R002Error"}}}
        "422":
          description: "Invalid path or query parameters; validation never echoes raw input."
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/RequestValidationError"}}}
  "/organizations/{organization_id}/projects/{project_id}/integration-hub/adapters/{adapter_key}/layers/{layer_id}/sync-preview":
    post:
      operationId: "previewIntegrationHubSync"
      x-required-permission: "project.edit"
      description: "Non-mutating step-1 diff preview for controlled two-step GeoPackage sync. Compares an edited GeoPackage (.gpkg, up to 16 MiB) against the target layer pinned to base_content_revision and base_schema_revision under PostgreSQL RLS, R002 project.edit and service principal ceilings, project GIS ACL, and explicit R003 CRS matching. Deletions are blocked by default; omitted server features are reported in omitted_server_feature_count."
      security: [{"sessionCookie":[]},{"serviceBearer":[]}]
      parameters:
        - {"$ref":"#/components/parameters/OrganizationId"}
        - {"$ref":"#/components/parameters/ProjectId"}
        - {"$ref":"#/components/parameters/AdapterKey"}
        - {"$ref":"#/components/parameters/LayerId"}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: "object"
              additionalProperties: false
              required: ["file","base_content_revision","base_schema_revision"]
              properties:
                file:
                  type: "string"
                  format: "binary"
                  description: "Edited GeoPackage (.gpkg) snapshot (maximum 16 MiB) matching the layer explicit EPSG CRS."
                base_content_revision:
                  type: "string"
                  pattern: "^[a-f0-9]{64}$"
                  description: "Pinned SHA-256 content_revision from the exported snapshot."
                base_schema_revision:
                  type: "string"
                  pattern: "^[a-f0-9]{64}$"
                  description: "Pinned SHA-256 schema_revision from the exported snapshot."
      responses:
        "200":
          description: "Successful non-mutating GeoPackage sync diff preview."
          headers:
            Cache-Control:
              required: true
              description: "Always no-store to prevent caching of authorized GIS diff previews."
              schema: {"type":"string","const":"no-store"}
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/SyncPreviewResponse"}}}
        "401":
          description: "Authentication/credential missing or invalid."
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/R002Error"}}}
        "403":
          description: "R002 project.edit authorization, lifecycle, service principal ceiling, or scoped GIS edit ACL denial; generic to inaccessible target."
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/R002Error"}}}
        "404":
          description: "Scoped organization, project, adapter key, or layer missing, retired, hidden, or wrong owner; no private details."
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/R002Error"}}}
        "409":
          description: "Adapter does not support controlled GeoPackage sync or layer state conflicts with sync preview."
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/R002Error"}}}
        "413":
          description: "Uploaded GeoPackage exceeds the 16 MiB sync upload size limit."
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/R002Error"}}}
        "422":
          description: "Invalid GeoPackage payload, CRS mismatch, invalid revisions, or request validation failure."
          content:
            application/json:
              schema:
                anyOf:
                  - {"$ref":"#/components/schemas/R002Error"}
                  - {"$ref":"#/components/schemas/RequestValidationError"}
  "/organizations/{organization_id}/projects/{project_id}/integration-hub/adapters/{adapter_key}/layers/{layer_id}/sync-push":
    post:
      operationId: "pushIntegrationHubSync"
      x-required-permission: "project.edit"
      description: "Controlled step-2 GeoPackage sync commit through R006 versioned changesets. Recomputes the diff from the uploaded GeoPackage (.gpkg, up to 16 MiB) and requires exact expected_diff_sha256 match, current base_content_revision/base_schema_revision, non-reserved caller operation_id, explicit readable CRS match, and project.edit + per-layer GIS ACL authorization. Deletions remain blocked by default."
      security: [{"sessionCookie":[]},{"serviceBearer":[]}]
      parameters:
        - {"$ref":"#/components/parameters/OrganizationId"}
        - {"$ref":"#/components/parameters/ProjectId"}
        - {"$ref":"#/components/parameters/AdapterKey"}
        - {"$ref":"#/components/parameters/LayerId"}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: "object"
              additionalProperties: false
              required:
                - "file"
                - "base_content_revision"
                - "base_schema_revision"
                - "operation_id"
                - "expected_diff_sha256"
              properties:
                file:
                  type: "string"
                  format: "binary"
                  description: "Edited GeoPackage (.gpkg) snapshot (maximum 16 MiB) matching the previewed file."
                base_content_revision:
                  type: "string"
                  pattern: "^[a-f0-9]{64}$"
                  description: "Pinned SHA-256 content_revision from the exported snapshot."
                base_schema_revision:
                  type: "string"
                  pattern: "^[a-f0-9]{64}$"
                  description: "Pinned SHA-256 schema_revision from the exported snapshot."
                operation_id:
                  type: "string"
                  minLength: 1
                  maxLength: 128
                  pattern: "^[A-Za-z0-9_.:-]+$"
                  description: "Caller-supplied R006 idempotency key; must not begin with reserved prefix 'field-sync-'."
                expected_diff_sha256:
                  type: "string"
                  pattern: "^[a-f0-9]{64}$"
                  description: "Exact SHA-256 diff digest returned by previewIntegrationHubSync."
                summary:
                  type: "string"
                  minLength: 1
                  maxLength: 500
                  default: "QGIS GeoPackage sync push"
                  description: "Optional human-readable summary recorded on the R006 changeset."
      responses:
        "201":
          description: "Successful R006 changeset commit created from previewed GeoPackage diff."
          headers:
            Cache-Control:
              required: true
              description: "Always no-store to prevent caching of authorized GIS sync responses."
              schema: {"type":"string","const":"no-store"}
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/SyncPushResponse"}}}
        "401":
          description: "Authentication/credential missing or invalid."
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/R002Error"}}}
        "403":
          description: "R002 project.edit authorization, lifecycle, service principal ceiling, or scoped GIS edit ACL denial; generic to inaccessible target."
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/R002Error"}}}
        "404":
          description: "Scoped organization, project, adapter key, or layer missing, retired, hidden, or wrong owner; no private details."
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/R002Error"}}}
        "409":
          description: "Stale base revision, expected_diff_sha256 mismatch, no committable changes, unsupported adapter, or R006 changeset conflict."
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/R002Error"}}}
        "413":
          description: "Uploaded GeoPackage exceeds the 16 MiB sync upload size limit."
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/R002Error"}}}
        "422":
          description: "Invalid GeoPackage payload, CRS mismatch, reserved or invalid operation_id, or request validation failure."
          content:
            application/json:
              schema:
                anyOf:
                  - {"$ref":"#/components/schemas/R002Error"}
                  - {"$ref":"#/components/schemas/RequestValidationError"}
components:
  securitySchemes:
    sessionCookie: {"type":"apiKey","in":"cookie","name":"ovg_session"}
    serviceBearer: {"type":"http","scheme":"bearer"}
  parameters:
    OrganizationId: {"name":"organization_id","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}
    ProjectId: {"name":"project_id","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}
    AdapterKey:
      name: "adapter_key"
      in: "path"
      required: true
      schema: {"type":"string","minLength":1,"maxLength":64,"pattern":"^[a-z0-9_]+$"}
      description: "Canonical integration hub adapter identifier (e.g. ogc_services, qgis, postgis, microstation_v8i)."
    LayerId:
      name: "layer_id"
      in: "path"
      required: true
      schema: {"type":"string","format":"uuid"}
      description: "Project-scoped active spatial layer identifier."
  schemas:
    ActionEvaluation:
      type: "object"
      additionalProperties: false
      description: "Fail-closed policy preflight for a single connector action. Never an execution token or authorization grant."
      required:
        - "action"
        - "required_permission"
        - "eligible_by_role"
        - "executable_in_hub"
        - "allowed"
        - "reason"
      properties:
        action:
          type: "string"
          enum:
            - "catalog.discover"
            - "connection.inspect"
            - "connection.configure"
            - "data.import"
            - "data.export"
            - "sync.pull"
            - "sync.push"
            - "sync.approve"
        required_permission:
          type: "string"
          enum: ["project.read","project.edit","project.manage"]
        eligible_by_role: {"type":"boolean"}
        executable_in_hub: {"type":"boolean"}
        allowed: {"type":"boolean"}
        reason:
          type: "string"
          enum: ["permission_denied","unsupported_by_adapter","not_implemented","catalog_only","read_only_export","controlled_changeset_sync"]
    AdapterSummary:
      type: "object"
      additionalProperties: false
      required:
        - "key"
        - "name"
        - "category"
        - "mode"
        - "lifecycle"
        - "protocols"
        - "note"
        - "existing_api"
        - "actions"
      properties:
        key: {"type":"string","minLength":1,"maxLength":64,"pattern":"^[a-z0-9_]+$"}
        name: {"type":"string","minLength":1,"maxLength":200}
        category:
          type: "string"
          enum: ["gis","cad","cadastral","database","tabular","survey_3d"]
        mode:
          type: "string"
          enum:
            - "remote_service"
            - "open_protocols"
            - "file_or_desktop_bridge"
            - "windows_bridge"
            - "file_exchange"
            - "format_adapter"
            - "database_bridge"
        lifecycle:
          type: "string"
          enum: ["existing_read_only","candidate","planned"]
        protocols:
          type: "array"
          minItems: 1
          maxItems: 32
          items: {"type":"string","minLength":1,"maxLength":64}
        note: {"type":"string","minLength":1,"maxLength":500}
        existing_api:
          anyOf: [{"type":"string","minLength":1,"maxLength":128},{"type":"null"}]
        actions:
          type: "array"
          minItems: 1
          maxItems: 32
          items: {"$ref":"#/components/schemas/ActionEvaluation"}
    IntegrationHubCatalogResponse:
      type: "object"
      additionalProperties: false
      required:
        - "schema_version"
        - "organization_id"
        - "project_id"
        - "mode"
        - "default_write_policy"
        - "scoped_access"
        - "adapters"
      properties:
        schema_version: {"type":"integer","const":1}
        organization_id: {"type":"string","format":"uuid"}
        project_id: {"type":"string","format":"uuid"}
        mode: {"type":"string","enum":["catalog_read_only"]}
        default_write_policy: {"type":"string","enum":["deny"]}
        scoped_access:
          type: "boolean"
          description: "True when the calling human actor is subject to project-level gis_access scoped member restrictions."
        adapters:
          type: "array"
          minItems: 0
          maxItems: 100
          items: {"$ref":"#/components/schemas/AdapterSummary"}
    ExistingEndpointDescriptor:
      type: "object"
      additionalProperties: false
      required: ["name","method","path_template","required_permission"]
      properties:
        name: {"type":"string","minLength":1,"maxLength":128}
        method: {"type":"string","enum":["GET","POST"]}
        path_template: {"type":"string","minLength":1,"maxLength":500}
        required_permission: {"type":"string","minLength":1,"maxLength":128}
    ReadOnlyConnectionProfile:
      type: "object"
      additionalProperties: false
      description: "Non-secret read-only exchange contract for an adapter profile. Direct internal DB credentials and default writes are structurally prohibited."
      required:
        - "adapter_key"
        - "access_mode"
        - "supports_direct_db_credentials"
        - "requires_per_layer_acl"
        - "default_write_policy"
        - "supported_protocols"
        - "existing_endpoints"
        - "crs_policy"
        - "restrictions"
      properties:
        adapter_key: {"type":"string","minLength":1,"maxLength":64,"pattern":"^[a-z0-9_]+$"}
        access_mode: {"type":"string","enum":["read_only_exchange"]}
        supports_direct_db_credentials: {"type":"boolean","const":false}
        requires_per_layer_acl: {"type":"boolean","const":true}
        default_write_policy: {"type":"string","enum":["deny"]}
        supported_protocols:
          type: "array"
          minItems: 1
          maxItems: 32
          items: {"type":"string","minLength":1,"maxLength":64}
        export_formats:
          type: "array"
          minItems: 0
          maxItems: 8
          items:
            type: "string"
            enum: ["geopackage","geojson","postgis_sql","dxf"]
          description: "Optional list of direct read-only layer export formats supported by this adapter."
        sync_push_enabled:
          type: "boolean"
          description: "Optional flag indicating whether controlled two-step GeoPackage changeset sync (preview + explicit push) is enabled for this adapter."
        deletions_blocked_by_default:
          type: "boolean"
          description: "Optional flag confirming that omitted server features are never deleted automatically during GeoPackage sync push."
        existing_endpoints:
          type: "array"
          minItems: 0
          maxItems: 32
          items: {"$ref":"#/components/schemas/ExistingEndpointDescriptor"}
        crs_policy: {"type":"string","enum":["explicit_only_never_inferred"]}
        restrictions:
          type: "array"
          minItems: 1
          maxItems: 64
          items: {"type":"string","minLength":1,"maxLength":500}
    AdapterLayerDescriptor:
      type: "object"
      additionalProperties: false
      description: "ACL-filtered active layer summary for read-only adapter exchange inspection. Coordinates and CRS are never inferred."
      required:
        - "layer_id"
        - "source_id"
        - "name"
        - "geometry_family"
        - "dimensions"
        - "validation_state"
        - "source_crs_code"
        - "stored_crs_code"
        - "crs_explicit"
        - "layer_revision"
        - "content_revision"
        - "schema_revision"
        - "export_permitted"
      properties:
        layer_id: {"type":"string","format":"uuid"}
        source_id: {"type":"string","format":"uuid"}
        name: {"type":"string","minLength":1,"maxLength":200}
        geometry_family:
          type: "string"
          enum: ["Point","LineString","Polygon","mixed","unsupported","unknown"]
        dimensions:
          type: "string"
          enum: ["XY","XYZ","XYM","XYZM","mixed","unknown"]
        validation_state:
          type: "string"
          enum: ["ready","invalid","not_ready"]
        source_crs_code:
          anyOf: [{"type":"integer","minimum":1,"maximum":2147483647},{"type":"null"}]
          description: "Explicit EPSG code declared on the source (R003 registry: 4326, 3857, 4756, 5899 readable; 3405, 3406 definition-only), or null if absent."
        stored_crs_code:
          anyOf: [{"type":"integer","minimum":1,"maximum":2147483647},{"type":"null"}]
          description: "Verified stored EPSG code (R003 readable codes: 4326, 3857, 4756, 5899), or null if unverified/not ready."
        crs_explicit: {"type":"boolean"}
        layer_revision: {"type":"integer","minimum":1,"maximum":9007199254740991}
        content_revision: {"type":"string","pattern":"^[a-f0-9]{64}$"}
        schema_revision: {"type":"string","pattern":"^[a-f0-9]{64}$"}
        export_permitted:
          type: "boolean"
          description: "True only when layer is ready with explicit readable CRS and actor satisfies role/ceiling plus per-layer gis_access export authorization."
    AdapterProfileResponse:
      type: "object"
      additionalProperties: false
      required:
        - "schema_version"
        - "organization_id"
        - "project_id"
        - "scoped_access"
        - "default_write_policy"
        - "adapter"
        - "execution_status"
        - "connection_profile"
        - "layers"
      properties:
        schema_version: {"type":"integer","const":1}
        organization_id: {"type":"string","format":"uuid"}
        project_id: {"type":"string","format":"uuid"}
        scoped_access: {"type":"boolean"}
        default_write_policy: {"type":"string","enum":["deny"]}
        adapter: {"$ref":"#/components/schemas/AdapterSummary"}
        execution_status:
          type: "string"
          enum:
            - "existing_read_only_api"
            - "read_only_profile_ready"
            - "candidate_external_branch"
            - "planned_not_implemented"
        connection_profile:
          anyOf: [{"$ref":"#/components/schemas/ReadOnlyConnectionProfile"},{"type":"null"}]
        layers:
          type: "array"
          minItems: 0
          maxItems: 1000
          items: {"$ref":"#/components/schemas/AdapterLayerDescriptor"}
    SyncPreviewOperation:
      type: "object"
      additionalProperties: false
      description: "Single non-destructive feature operation proposed by a GeoPackage sync preview."
      required: ["op_type","feature_id","changed_fields","geometry_changed"]
      properties:
        op_type:
          type: "string"
          enum: ["create","update"]
        feature_id:
          type: "string"
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9_-]+$"
        changed_fields:
          type: "array"
          minItems: 0
          maxItems: 256
          items: {"type":"string","minLength":1,"maxLength":128}
        geometry_changed:
          type: "boolean"
    SyncPreviewResponse:
      type: "object"
      additionalProperties: false
      description: "Non-mutating diff preview for controlled two-step GeoPackage sync."
      required:
        - "schema_version"
        - "adapter_key"
        - "layer_id"
        - "source_id"
        - "stored_crs_code"
        - "geometry_family"
        - "base_content_revision"
        - "current_content_revision"
        - "base_schema_revision"
        - "current_schema_revision"
        - "stale_revision"
        - "deletions_blocked"
        - "create_count"
        - "update_count"
        - "unchanged_count"
        - "omitted_server_feature_count"
        - "omitted_server_feature_ids"
        - "diff_sha256"
        - "can_commit"
        - "operations"
      properties:
        schema_version: {"type":"integer","const":1}
        adapter_key: {"type":"string","minLength":1,"maxLength":64,"pattern":"^[a-z0-9_]+$"}
        layer_id: {"type":"string","format":"uuid"}
