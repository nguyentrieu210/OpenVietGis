      },
      "serviceBearer": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "parameters": {
      "OrganizationId": {
        "name": "organization_id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "ProjectId": {
        "name": "project_id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "LayerId": {
        "name": "layer_id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "OperationId": {
        "name": "operation_id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "ContentRevision": {
        "name": "content_revision",
        "in": "query",
        "required": true,
        "schema": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$"
        }
      },
      "SchemaRevision": {
        "name": "schema_revision",
        "in": "query",
        "required": true,
        "schema": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$"
        }
      },
      "CsrfHeaderOptionalForBearer": {
        "name": "X-OpenVietGIS-CSRF",
        "in": "header",
        "required": false,
        "description": "Mandatory for cookie-authenticated mutations; not required for service bearer.",
        "schema": {
          "type": "string",
          "minLength": 1
        }
      },
      "HistoryLimit": {
        "name": "limit",
        "in": "query",
        "required": false,
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 100,
          "default": 100
        }
      },
      "AfterRevision": {
        "name": "after_revision",
        "in": "query",
        "required": false,
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 9007199254740991
        }
      },
      "ViewportLimit": {
        "name": "limit",
        "in": "query",
        "required": false,
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 1000,
          "default": 500
        }
      },
      "West": {
        "name": "west",
        "in": "query",
        "required": true,
        "schema": {
          "type": "number",
          "minimum": -180,
