      type: "object"
      additionalProperties: false
      required: ["type","coordinates","coordinate_reference"]
      properties:
        type: {"const":"Point"}
        coordinates: {"$ref":"#/components/schemas/Position"}
        coordinate_reference: {"$ref":"#/components/schemas/CoordinateReference"}
    LineStringGeometry:
      type: "object"
      additionalProperties: false
      required: ["type","coordinates","coordinate_reference"]
      properties:
        type: {"const":"LineString"}
        coordinates: {"type":"array","minItems":2,"maxItems":4096,"items":{"$ref":"#/components/schemas/Position"}}
