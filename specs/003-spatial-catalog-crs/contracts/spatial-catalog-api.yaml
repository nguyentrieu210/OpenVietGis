        unit: {"type":"string","enum":["degree","metre"]}
        coordinate_order: {"const":"xy"}
        x_axis: {"type":"string","enum":["longitude","easting"]}
        y_axis: {"type":"string","enum":["latitude","northing"]}
        projection_parameters: {"type":"object","additionalProperties":{"type":["string","number"]},"maxProperties":16}
        area_of_use: {"type":"string","minLength":1,"maxLength":500}
        disposition: {"type":"string","enum":["readable","definition_only"]}
    TransformationProfile:
      type: "object"
      additionalProperties: false
      required: ["source_code","target_code","operation_id","method","validated_area","tolerance","tolerance_unit","evidence_id"]
      properties:
        source_code: {"type":"integer","enum":[4326,3857,4756,5899]}
        target_code: {"type":"integer","enum":[4326,3857,4756,5899]}
        operation_id: {"type":"string","minLength":1,"maxLength":128}
        method: {"type":"string","minLength":1,"maxLength":500}
        validated_area: {"type":"string","minLength":1,"maxLength":500}
        tolerance: {"type":"number","exclusiveMinimum":0}
        tolerance_unit: {"type":"string","enum":["degree","metre"]}
        evidence_id: {"type":"string","minLength":1,"maxLength":200}
    CRSRegistry:
      type: "object"
      additionalProperties: false
      required: ["organization_id","project_id","profiles","transformations"]
