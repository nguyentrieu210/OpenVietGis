    AttributeValue:
      description: "Interpret against field type in pinned schema: integer signed 32-bit; decimal canonical base-10 string, timestamp UTC RFC3339 string, text string, boolean, explicit null only if nullable."
      type: ["string","integer","boolean","null"]
      maxLength: 4096
      minimum: -2147483648
      maximum: 2147483647
