components:
  securitySchemes:
    sessionCookie: {"type":"apiKey","in":"cookie","name":"ovg_session"}
    serviceBearer: {"type":"http","scheme":"bearer"}
  parameters:
    OrganizationId: {"name":"organization_id","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}
    ProjectId: {"name":"project_id","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}
    SourceId: {"name":"source_id","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}
    LayerId: {"name":"layer_id","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}
    FeatureId:
      name: "feature_id"
      in: "path"
      required: true
      schema: {"type":"string","minLength":1,"maxLength":128,"pattern":"^[A-Za-z0-9_-]+$"}
    CsrfHeaderOptionalForBearer:
      name: "X-OpenVietGIS-CSRF"
      in: "header"
      required: false
      schema: {"type":"string"}
      description: "Required for human cookie session mutations, not service bearer."
    Limit:
      name: "limit"
      in: "query"
      required: false
      schema: {"type":"integer","minimum":1,"maximum":100,"default":100}
      description: "Reject >100; no clamp."
    AfterId:
      name: "after_id"
      in: "query"
      required: false
      schema: {"type":"string","format":"uuid"}
      description: "Exclusive ascending UUID keyset cursor from previous page."
    ContentRevision: {"name":"content_revision","in":"query","required":true,"schema":{"type":"string","pattern":"^[a-f0-9]{64}$"}}
    SchemaRevision: {"name":"schema_revision","in":"query","required":true,"schema":{"type":"string","pattern":"^[a-f0-9]{64}$"}}
    AfterFeatureId:
      name: "after_feature_id"
      in: "query"
      required: false
      schema: {"type":"string","minLength":1,"maxLength":128,"pattern":"^[A-Za-z0-9_-]+$"}
      description: "Exclusive ascending feature key; previous page's next_after_feature_id."
    IncludeGeometry: {"name":"include_geometry","in":"query","required":false,"schema":{"type":"boolean","default":true}}
    ResponseCRS:
      name: "response_crs"
      in: "query"
      required: false
      schema: {"type":"integer","minimum":1,"maximum":2147483647}
      description: "EPSG code; only 4326/3857/4756/5899 accepted. Default verified stored CRS; only with include_geometry=true. Unsupported positive code fails domain validation."
  schemas:
    CoordinateReference:
      type: "object"
      additionalProperties: false
      required: ["authority","code","coordinate_order","x_axis","y_axis","unit"]
      properties:
        authority: {"const":"EPSG"}
        code: {"type":"integer","enum":[4326,3857,4756,5899]}
        coordinate_order: {"const":"xy"}
        x_axis: {"type":"string","enum":["longitude","easting"]}
        y_axis: {"type":"string","enum":["latitude","northing"]}
        unit: {"type":"string","enum":["degree","metre"]}
    CRSProfile:
      type: "object"
      additionalProperties: false
      required:
        - "authority"
        - "code"
        - "name"
        - "datum"
        - "native_axes"
        - "unit"
        - "coordinate_order"
        - "x_axis"
        - "y_axis"
        - "projection_parameters"
        - "area_of_use"
        - "disposition"
      properties:
        authority: {"const":"EPSG"}
