        fields: {"type":"array","minItems":0,"maxItems":100,"items":{"$ref":"#/components/schemas/SourceField"}}
        geometry_family: {"type":"string","enum":["Point","LineString","Polygon","mixed","unsupported","unknown"]}
        dimensions: {"type":"string","enum":["XY","XYZ","XYM","XYZM","mixed","unknown"]}
        state: {"type":"string","enum":["known","unavailable"]}
    Extent:
      type: "object"
      additionalProperties: false
      required: ["min_x","min_y","max_x","max_y","coordinate_reference"]
