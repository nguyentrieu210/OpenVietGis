      required: ["authority","code","coordinate_order"]
      properties:
        authority: {"const":"EPSG"}
        code:
          type: "integer"
          minimum: 1
          maximum: 2147483647
          description: "Readable CRS only: 4326, 3857, 4756, 5899; other positive EPSG codes fail domain validation."
        coordinate_order: {"const":"xy"}
    ValidationReason:
      type: "object"
      additionalProperties: false
      required: ["code","message"]
      properties:
        code:
          type: "string"
          enum:
            - "MISSING_CRS"
            - "UNKNOWN_CRS"
            - "UNSUPPORTED_CRS"
            - "CRS_MISMATCH"
            - "GEOMETRY_FAMILY_MISMATCH"
            - "UNSUPPORTED_DIMENSIONS"
            - "UNSUPPORTED_GEOMETRY"
            - "NULL_GEOMETRY"
            - "EMPTY_GEOMETRY"
            - "INVALID_GEOMETRY"
            - "AXIS_CONFLICT"
            - "COORDINATE_OUT_OF_DOMAIN"
            - "EXTENT_WRAP_UNSUPPORTED"
            - "SCHEMA_MISMATCH"
            - "FIXTURE_UNAVAILABLE"
            - "BOUNDS_EXCEEDED"
        message: {"type":"string","minLength":1,"maxLength":500}
    SourceField:
      type: "object"
