openapi: "3.1.0"
info:
  title: "OpenVietGIS Spatial Catalog and CRS API"
  version: "0.3.0"
  description: "R003 reference fixture catalog, explicit CRS and pinned bounded feature reads. See catalog-semantics.md for cross-field, authorization, revision and validation invariants."
servers: [{"url":"/api/v1"}]
paths:
