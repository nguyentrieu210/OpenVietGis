      parameters:
        - {"$ref":"#/components/parameters/OrganizationId"}
        - {"$ref":"#/components/parameters/ProjectId"}
        - {"$ref":"#/components/parameters/Limit"}
        - {"$ref":"#/components/parameters/AfterId"}
      responses:
        "200":
          description: "Successful authorized operation."
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/SourceList"}}}
        "401":
          description: "Authentication/credential missing or invalid."
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/R002Error"}}}
        "403":
          description: "R002 current authorization, lifecycle or CSRF denial; generic to inaccessible target."
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/R002Error"}}}
        "404":
          description: "Scoped resource missing, retired, hidden, or wrong owner; no private details."
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/R002Error"}}}
        "422":
          description: "Invalid request or fail-closed spatial semantics; validation never echoes raw input."
          content:
            "application/json":
              schema: {"oneOf":[{"$ref":"#/components/schemas/RequestValidationError"},{"$ref":"#/components/schemas/SpatialError"}]}
    post:
      operationId: "registerSpatialSource"
      x-required-permission: "project.edit"
      description: "Register allowlisted fixture; valid registration may persist truthful invalid/not-ready state. Atomic materialization and change evidence."
