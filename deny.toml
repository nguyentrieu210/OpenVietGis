[graph]
targets = [{ triple = "x86_64-unknown-linux-gnu" }]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
unsound = "workspace"
unused-ignored-advisory = "deny"
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained with no safe upgrade; temporary compatibility triage while SQLx timestamp migration to time is qualified. Merge to main requires owner approval or removal of this exception.", expiry = "2026-12-10" },
]

[licenses]
version = 2
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "LGPL-2.1-or-later",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
  { crate = "openssl-sys", reason = "Prefer rustls; native OpenSSL requires explicit security approval" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
  "https://github.com/rust-lang/crates.io-index",
]
allow-git = []
