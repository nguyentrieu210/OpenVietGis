name: SPEC 073 baseline inventory
on:
  push:
    branches: ["073-native-mobile-platform"]
    paths: ["tools/mobile/spec073-baseline*.mjs", ".github/workflows/spec073-baseline.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  graph:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Matrix and guard tests
        run: node --test tools/mobile/spec073-baseline.test.mjs
      - name: Resolve pinned candidate graph
        run: node tools/mobile/spec073-baseline.mjs "$RUNNER_TEMP/spec073-baseline"
      - name: Upload raw graph evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spec073-baseline-graph
          path: ${{ runner.temp }}/spec073-baseline
          if-no-files-found: warn
          retention-days: 14
