name: Rust MCP Gateway

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/mcp-rust/**'
      - '.github/workflows/rust-mcp.yml'
  push:
    branches: [main, 064-e16-native-mcp]
    paths:
      - 'apps/mcp-rust/**'
      - '.github/workflows/rust-mcp.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  native-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mcp-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/mcp-rust
      - run: cargo test --locked
      - run: cargo build --locked --release
      - uses: actions/upload-artifact@v4
        with:
          name: openvietgis-mcp-rust-linux
          path: apps/mcp-rust/target/release/openvietgis-mcp-rust
          if-no-files-found: error
