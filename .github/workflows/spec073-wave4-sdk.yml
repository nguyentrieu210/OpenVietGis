name: SPEC 073 W4 Dart SDK contracts
on:
  push:
    branches: ["073-native-mobile-platform"]
    paths: ["packages/dart-sdk/**", ".github/workflows/spec073-wave4-sdk.yml"]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pinned Flutter Dart SDK
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth=1 origin refs/tags/3.50.0:refs/tags/3.50.0
          git -C "$RUNNER_TEMP/flutter" checkout --detach refs/tags/3.50.0
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = ab2912035e160d9cad6306df307576da6128ebdb
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: SDK tests
        working-directory: packages/dart-sdk
        run: |
          dart --version
          dart pub get
          dart analyze
          dart test
