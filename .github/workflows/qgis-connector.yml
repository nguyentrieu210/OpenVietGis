name: QGIS Connector 1.0 - package and desktop smoke

on:
  pull_request:
    paths:
      - "integrations/qgis_plugin/**"
      - "apps/api/tests/unit/integration_hub/test_qgis_workspace.py"
      - "tools/package_qgis_plugin.py"
      - "tools/smoke_qgis_native.py"
      - "tools/tests/test_package_qgis_plugin.py"
      - "tools/tests/test_qgis_connector_simple_ui.py"
      - "tools/tests/test_qgis_managed_snapshots.py"
      - "tools/tests/test_managed_snapshot_contract.py"
      - "tools/tests/test_managed_delta_contract.py"
      - "tools/tests/test_managed_sync_cancellation.py"
      - "tools/tests/test_qgis_desktop_recovery.py"
      - "apps/web-next/src/QgisConnectPage.tsx"
      - "apps/api/tests/unit/integration_hub/test_qgis_plugin_client.py"
      - ".github/workflows/qgis-connector.yml"
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      native_qgis:
        description: "Install system QGIS and run native offscreen plugin UI smoke"
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  qgis-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install isolated API test dependencies
        run: uv sync --project apps/api --frozen
      - name: Lint reviewed QGIS files and release tool
        run: |
          uv run --project apps/api ruff check \
            integrations/qgis_plugin/openvietgis_connector \
            apps/api/tests/unit/integration_hub/test_qgis_workspace.py \
            tools/package_qgis_plugin.py tools/tests/test_package_qgis_plugin.py
      - name: Test manual bilateral sync and deterministic ZIP
        run: |
          uv run --project apps/api python -m pytest -q \
            apps/api/tests/unit/integration_hub/test_qgis_workspace.py \
            tools/tests/test_package_qgis_plugin.py \
            tools/tests/test_qgis_connector_simple_ui.py \
            tools/tests/test_qgis_managed_snapshots.py \
            tools/tests/test_managed_snapshot_contract.py \
            tools/tests/test_managed_delta_contract.py \
            tools/tests/test_managed_sync_cancellation.py \
            tools/tests/test_qgis_desktop_recovery.py \
            apps/api/tests/unit/integration_hub/test_qgis_plugin_client.py
      - name: Package installable experimental QGIS plugin
        run: |
          uv run --project apps/api python tools/package_qgis_plugin.py \
            --output dist/openvietgis_connector-1.0.0.zip
          (cd dist && sha256sum -c openvietgis_connector-1.0.0.zip.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: openvietgis-qgis-1.0.0-experimental
          path: |
            dist/openvietgis_connector-1.0.0.zip
            dist/openvietgis_connector-1.0.0.zip.sha256
          if-no-files-found: error
          retention-days: 14

  native-qgis-smoke:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.native_qgis }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install native QGIS with Qt offscreen support
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends python3-qgis qgis-common xvfb xauth
      - name: Check QGIS version and plugin controls
        env:
          QT_QPA_PLATFORM: offscreen
          QGIS_PREFIX_PATH: /usr
        run: |
          /usr/bin/python3 -c 'from qgis.core import Qgis; print("QGIS", Qgis.QGIS_VERSION)'
          xvfb-run -a /usr/bin/python3 tools/smoke_qgis_native.py
