name: SPEC 073 W7 independent iOS candidate
on:
  pull_request:
    branches: ["073-native-mobile-platform"]
    paths: ["apps/mobile-flutter/**", "crates/ovg-mobile-ffi/**", "infra/mobile/**", ".github/workflows/spec073-wave7-ios.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unsigned-ios:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exact Flutter and Rust candidate on ARM64 Mac
        run: |
          set -euxo pipefail
          test "$(uname -m)" = arm64
          xcodebuild -version
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth=1 origin refs/tags/3.50.0:refs/tags/3.50.0
          git -C "$RUNNER_TEMP/flutter" checkout --detach refs/tags/3.50.0
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = ab2912035e160d9cad6306df307576da6128ebdb
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt
          rustup target add --toolchain 1.85.1 aarch64-apple-ios aarch64-apple-ios-sim
      - name: Generate native candidate
        run: |
          set -euxo pipefail
          flutter config --no-analytics
          cd "$RUNNER_TEMP"
          rustup override set 1.85.1
          cargo install --locked --version 1.0.104 cargo-expand
          cargo install --locked --version 2.11.1 flutter_rust_bridge_codegen
          flutter_rust_bridge_codegen create openvietgis_mobile --org org.openvietgis
          cd openvietgis_mobile
          cp "$GITHUB_WORKSPACE/apps/mobile-flutter/pubspec.yaml" .
          mkdir -p vendor
          cp -R "$GITHUB_WORKSPACE/packages/dart-sdk" vendor/openvietgis_sdk
          python3 -c 'from pathlib import Path; p=Path("pubspec.yaml"); p.write_text(p.read_text().replace("../../packages/dart-sdk","vendor/openvietgis_sdk"))'
          cp "$GITHUB_WORKSPACE/apps/mobile-flutter/lib/"*.dart lib/
          cp "$GITHUB_WORKSPACE/crates/ovg-mobile-ffi/src/api/simple.rs" rust/src/api/simple.rs
          mkdir -p test
          cp "$GITHUB_WORKSPACE/apps/mobile-flutter/test/"*.dart test/
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          p=Path("rust/Cargo.toml")
          root=os.environ["GITHUB_WORKSPACE"]
          deps='\n'.join(f'{n} = {{ path = "{root}/crates/{n}" }}' for n in ["ovg-mobile-engine","ovg-local-storage"])
          text=p.read_text().replace("[dependencies]", "[dependencies]\n"+deps+'\nuuid = { version = "1", features = ["v4"] }\nserde_json = "1"',1)
          text=text.replace("[dependencies]", '[dependencies]\novg-project-store = { git = "https://github.com/nguyentrieu210/OpenVietGis", rev = "aa715a86ab2599048fe6dec4fea5052349f7dbed" }',1)
          text+='\n[patch."https://github.com/nguyentrieu210/OpenVietGis"]\n'+'\n'.join(f'{n} = {{ path = "{root}/crates/{n}" }}' for n in ["ovg-mobile-engine","ovg-local-storage","ovg-spatial"])+'\n'
          p.write_text(text)
          p=Path("ios/Runner/Info.plist")
          data=plistlib.loads(p.read_bytes())
          data["NSLocationWhenInUseUsageDescription"]="Record foreground survey position when you choose GPS survey."
          p.write_bytes(plistlib.dumps(data))
          PY
          python3 "$GITHUB_WORKSPACE/infra/mobile/install-media-provider.py" "$GITHUB_WORKSPACE" "$PWD"
          python3 "$GITHUB_WORKSPACE/infra/mobile/enable-local-tile-bridge.py" "$PWD"
          flutter pub get
          flutter_rust_bridge_codegen generate
          flutter analyze lib test
      - name: Simulator and unsigned physical-device build
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/openvietgis_mobile"
          mkdir -p "$RUNNER_TEMP/ios-evidence"
          flutter build ios --simulator --debug
          ditto -c -k --keepParent build/ios/iphonesimulator/Runner.app "$RUNNER_TEMP/ios-evidence/simulator.zip"
          flutter build ios --release --no-codesign
          ditto -c -k --keepParent build/ios/iphoneos/Runner.app "$RUNNER_TEMP/ios-evidence/unsigned-device.zip"
          xcodebuild -version > "$RUNNER_TEMP/ios-evidence/xcode.txt"
          flutter --version --machine > "$RUNNER_TEMP/ios-evidence/flutter.json"
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD > "$RUNNER_TEMP/ios-evidence/commit.txt"
          for f in build/ios/iphoneos/Runner.app/Runner build/ios/iphoneos/Runner.app/Frameworks/*.framework; do
            if [ -d "$f" ]; then f="$f/$(basename "$f" .framework)"; fi
            file "$f" | tee -a "$RUNNER_TEMP/ios-evidence/macho.txt"
            lipo -archs "$f" | tee -a "$RUNNER_TEMP/ios-evidence/macho.txt"
          done
          (cd "$RUNNER_TEMP/ios-evidence" && shasum -a 256 *.zip > SHA256SUMS)
          cp rust/Cargo.lock pubspec.lock "$RUNNER_TEMP/ios-evidence/"
          printf '%s\n' 'Unsigned candidate only; no I1 device, signing or policy acceptance.' > "$RUNNER_TEMP/ios-evidence/status.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: w7-ios-unsigned-candidate
          path: ${{ runner.temp }}/ios-evidence
          if-no-files-found: warn
