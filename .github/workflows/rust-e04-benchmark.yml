name: E04 Query Benchmark
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  workflow_dispatch:
  push:
    branches: ["064-e04", "064-data-engines-completion", "064-integration", "064-rust-platform", "064-convergence"]
    paths:
      - "apps/api-rust/src/queries.rs"
      - "crates/ovg-storage/src/queries/**"
      - "tests/rust-parity/e04_benchmark.py"
      - ".github/workflows/rust-e04-benchmark.yml"

permissions:
  contents: read

jobs:
  query-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: openvietgis-e04-benchmark
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: parity
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --project apps/api --frozen
      - run: docker compose -f infra/dev/compose.yaml up --detach --wait --wait-timeout 180 postgres-test
      - run: cargo build --locked -p openvietgis-api-rust --bin openvietgis-api-rust
      - name: Compare E04 over real HTTP and PostGIS
        run: |
          uv run --project apps/api python tests/rust-parity/e04_benchmark.py \
            --candidate target/debug/openvietgis-api-rust \
            --output dist/e04-benchmark/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e04-benchmark
          path: dist/e04-benchmark/
          if-no-files-found: warn
