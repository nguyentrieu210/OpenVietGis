name: SPEC 074 native CAD sidecar candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cad-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libudev-dev libfontconfig1-dev libgtk-3-dev libvulkan-dev pkg-config cmake clang
      - name: Build pinned editor from source
        run: |
          set -euxo pipefail
          git init "$RUNNER_TEMP/cad-source"
          git -C "$RUNNER_TEMP/cad-source" remote add origin https://github.com/nguyentrieu210/OpenVietCAD.git
          git -C "$RUNNER_TEMP/cad-source" fetch --depth=1 origin 3e738a2447d0cccf196f3b0f81823cd6a3e1d62d
          git -C "$RUNNER_TEMP/cad-source" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/cad-source" rev-parse HEAD)" = 3e738a2447d0cccf196f3b0f81823cd6a3e1d62d
          cargo build --release --locked --manifest-path "$RUNNER_TEMP/cad-source/Cargo.toml" --bin OpenCADStudio
          python3 infra/desktop/package_cad_sidecar.py --source "$RUNNER_TEMP/cad-source" --binary "$RUNNER_TEMP/cad-source/target/release/OpenCADStudio" --resource-root "$RUNNER_TEMP/cad-resource"
      - uses: actions/upload-artifact@v4
        with:
          name: native-cad-linux-candidate
          path: ${{ runner.temp }}/cad-resource/native-cad/
          if-no-files-found: error
