name: SPEC 074 native CAD desktop package candidate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/spec074-cad-sidecar.yml'
      - 'infra/desktop/package_cad_sidecar.py'
      - 'apps/desktop/src-tauri/tauri.cad.conf.json'
permissions:
  contents: read
jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb
            suffix: ''
          - os: windows-latest
            bundles: nsis
            suffix: '.exe'
          - os: macos-14
            bundles: dmg
            suffix: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
      CAD_PIN: 3e738a2447d0cccf196f3b0f81823cd6a3e1d62d
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libudev-dev libfontconfig1-dev libgtk-3-dev libvulkan-dev pkg-config cmake clang
      - name: Build pinned CAD editor and stage resources
        shell: bash
        run: |
          set -euxo pipefail
          git init "$RUNNER_TEMP/cad-source"
          git -C "$RUNNER_TEMP/cad-source" remote add origin https://github.com/nguyentrieu210/OpenVietCAD.git
          git -C "$RUNNER_TEMP/cad-source" fetch --depth=1 origin "$CAD_PIN"
          git -C "$RUNNER_TEMP/cad-source" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/cad-source" rev-parse HEAD)" = "$CAD_PIN"
          cargo build --release --locked --manifest-path "$RUNNER_TEMP/cad-source/Cargo.toml" --bin OpenCADStudio
          python infra/desktop/package_cad_sidecar.py --source "$RUNNER_TEMP/cad-source" --binary "$RUNNER_TEMP/cad-source/target/release/OpenCADStudio${{ matrix.suffix }}" --resource-root apps/desktop/src-tauri
      - name: Build common web UI
        run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openvietgis/web-next build
        env:
          VITE_OVG_DESKTOP: '1'
      - name: Install exact bundler and generate candidate icons
        shell: bash
        run: |
          cargo install --locked tauri-cli --version 2.11.4
          cd apps/desktop
          cargo tauri icon ../../infra/desktop/candidate-icon.svg --output src-tauri/icons
      - name: Build unsigned candidate installer
        shell: bash
        run: |
          cd apps/desktop
          cargo tauri build --ci --config src-tauri/tauri.cad.conf.json --features native-cad --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-cad-desktop-candidate-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/
            apps/desktop/src-tauri/native-cad/manifest.json
            apps/desktop/src-tauri/native-cad/LICENSE
            apps/desktop/src-tauri/native-cad/SOURCE.txt
            apps/desktop/src-tauri/Cargo.lock
          if-no-files-found: error
