name: SPEC 073 W4 identity candidate
on:
  push:
    branches: ["073-native-mobile-platform"]
    paths: ["crates/ovg-storage/src/mobile_identity.rs", ".github/workflows/spec073-wave4-identity.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: cargo test --locked -p ovg-storage mobile_identity::tests
      - run: cargo test --locked -p openvietgis-api-rust --test spec073_mobile_contract_baseline
