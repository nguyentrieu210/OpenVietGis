name: 064 Refresh Visual Baselines

on:
  push:
    branches: ["064-finalize"]
    paths:
      - ".github/workflows/064-refresh-visual-baselines.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: openvietgis-064-visual-refresh
      OPENVIETGIS_ENVIRONMENT: test
      OPENVIETGIS_DATABASE_URL: postgresql+psycopg://openvietgis:openvietgis@127.0.0.1:54330/openvietgis_test
      OPENVIETGIS_TEST_DATABASE_URL: postgresql+psycopg://openvietgis:openvietgis@127.0.0.1:54330/openvietgis_test
      OPENVIETGIS_MIGRATION_DATABASE_URL: postgresql+psycopg://openvietgis:openvietgis@127.0.0.1:54330/openvietgis_test
      OPENVIETGIS_RUNTIME_DATABASE_URL: postgresql+psycopg://openvietgis_runtime:openvietgis-runtime-dev@127.0.0.1:54330/openvietgis_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 064-finalize

      - uses: pnpm/action-setup@v4
        with:
          version: "12.21.0"
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project apps/api --frozen
          pnpm exec playwright install --with-deps chromium

      - name: Start isolated database and identity provider
        run: >-
          docker compose -f infra/dev/compose.yaml -f infra/dev/compose.identity.yaml
          up --detach --wait --wait-timeout 180 postgres-test keycloak

      - name: Apply guarded migrations
        run: >-
          uv run --project apps/api python -m tools.run_with_test_database python -c
          "from openvietgis_api.adapters.persistence.db import get_engine;
          connection = get_engine().connect(); connection.close()"

      - name: Regenerate only canonical visual baselines
        run: >-
          pnpm exec playwright test
          tests/e2e/app-shell-visual.spec.ts
          tests/e2e/map-workspace-visual.spec.ts
          --update-snapshots

      - name: Commit refreshed baselines to finalize branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/app-shell-visual.spec.ts-snapshots/*.png
          git add tests/e2e/map-workspace-visual.spec.ts-snapshots/*.png
          if git diff --cached --quiet; then
            echo "No visual baseline changes."
            exit 0
          fi
          git commit -m "test(visual): refresh canonical Playwright baselines"
          git push origin HEAD:064-finalize

      - name: Stop disposable services
        if: always()
        run: docker compose -f infra/dev/compose.yaml -f infra/dev/compose.identity.yaml down -v
