name: Windows V8i Connector - build and smoke test

on:
  push:
    branches:
      - feature/028-windows-v8i-receiver
    paths:
      - 'integrations/windows-v8i-receiver/**'
      - '.github/workflows/windows-v8i-connector.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-windows-connector:
    name: Build Windows Connector EXE (no Bentley runtime)
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        working-directory: integrations/windows-v8i-receiver
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: integrations/windows-v8i-receiver/requirements-build.txt
      - name: Install build prerequisites
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Offline Windows unit tests (no V8i required)
        shell: pwsh
        run: |
          python -m unittest discover -v -s tests -p test_receiver.py
          python -m unittest discover -v -s tests -p test_diagnostics.py
          python selftest.py
          python gui.py --self-test
      - name: Package Tkinter GUI and pywin32 COM adapter
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --onedir --windowed --name OpenVietGISConnector --collect-submodules win32com --hidden-import pythoncom --hidden-import pywintypes gui.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed" }
      - name: Execute built EXE without launching MicroStation
        shell: pwsh
        run: |
          & "dist/OpenVietGISConnector/OpenVietGISConnector.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw "Windows EXE smoke test failed" }
      - name: Build per-user installer ZIP
        shell: pwsh
        run: |
          $stage = "package/OpenVietGIS-Windows-Connector"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item dist/OpenVietGISConnector/* $stage -Recurse -Force
          Copy-Item -Path *.py,*.cmd,*.bas,README.md -Destination $stage -Force
          $zip = "package/OpenVietGIS-Windows-Connector-R028-windows-x64-unsigned.zip"
          Compress-Archive -Path $stage -DestinationPath $zip -CompressionLevel Optimal -Force
          Get-FileHash -Path $zip -Algorithm SHA256 | Format-List
          $check = Join-Path $env:RUNNER_TEMP "ovg-check"
          Expand-Archive -Path $zip -DestinationPath $check -Force
          & "$check/OpenVietGIS-Windows-Connector/OpenVietGISConnector.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw "Extracted EXE smoke test failed" }
      - name: Upload unsigned Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenVietGIS-Windows-Connector-R028-windows-x64-unsigned
          path: integrations/windows-v8i-receiver/package/OpenVietGIS-Windows-Connector-R028-windows-x64-unsigned.zip
          if-no-files-found: error
          retention-days: 14