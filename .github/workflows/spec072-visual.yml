name: SPEC072 UI visual
on:
  pull_request:
    paths:
      - 'apps/web-next/**'
      - 'packages/**'
      - 'modules/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/spec072-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: spec072-visual-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '12.21.0'
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser and pixel comparator
        run: |
          pnpm exec playwright install --with-deps chromium
          python -m pip install Pillow==11.1.0
      - name: Build frontend
        run: pnpm build:web
      - name: Capture independent synthetic sessions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/spec072
          git rev-parse HEAD > dist/spec072/candidate-sha.txt
          node --version > dist/spec072/node-version.txt
          node apps/web-next/run-ui-visual-smoke.mjs dist/spec072/first | tee dist/spec072/first.log
          node apps/web-next/run-ui-visual-smoke.mjs dist/spec072/second | tee dist/spec072/second.log
          python apps/web-next/scripts/compare-ui-screenshots.py dist/spec072/first dist/spec072/second | tee dist/spec072/pixel-diff.jsonl
      - name: Upload candidate visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec072-visual-candidate
          path: dist/spec072/
          if-no-files-found: warn
