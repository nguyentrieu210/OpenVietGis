[workspace]
resolver = "2"
members = [
    "apps/api-rust",
    "crates/ovg-core",
    "crates/ovg-storage",
    "crates/ovg-spatial",
    "crates/ovg-sync",
    "crates/ovg-processing",
    "crates/ovg-module-sdk",
    "modules/house_numbering/rust",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.85.1"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
geo-types = "0.7"
hex = "0.4"
hmac = "0.12"
http = "1"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

ovg-core = { path = "crates/ovg-core" }
ovg-storage = { path = "crates/ovg-storage" }
ovg-spatial = { path = "crates/ovg-spatial" }
ovg-sync = { path = "crates/ovg-sync" }
ovg-processing = { path = "crates/ovg-processing" }
ovg-module-sdk = { path = "crates/ovg-module-sdk" }
ovg-module-house-numbering = { path = "modules/house_numbering/rust" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
