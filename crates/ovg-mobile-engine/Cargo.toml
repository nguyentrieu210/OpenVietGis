[package]
name = "ovg-mobile-engine"
version = "0.2.0"
edition = "2021"
rust-version = "1.85.1"
license = "AGPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
ovg-core = { path = "../ovg-core" }
ovg-spatial = { path = "../ovg-spatial" }
ovg-processing = { path = "../ovg-processing" }
ovg-sync = { path = "../ovg-sync" }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"

geographiclib-rs = "=0.2.5"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde_json = "1"
