[package]
name = "ovg-native-providers"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"

[workspace]

[features]
default = []
ogr = ["dep:gdal"]
analytics = ["dep:duckdb"]

[dependencies]
gdal = { version = "=0.18.0", optional = true }
duckdb = { version = "=1.3.2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
