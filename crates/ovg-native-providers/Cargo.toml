[package]
name = "ovg-native-providers"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"

[workspace]

[features]
default = []
ogr = ["dep:gdal", "dep:gdal-sys", "dep:png"]
analytics = ["dep:duckdb"]
analytics-bundled = ["analytics", "duckdb/bundled"]

[dependencies]
gdal = { version = "=0.18.0", optional = true }
gdal-sys = { version = "0.11", optional = true }
duckdb = { version = "=1.3.2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
png = { version = "0.17", optional = true }
