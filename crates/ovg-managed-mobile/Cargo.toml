[package]
name = "ovg-managed-mobile"
version = "0.2.0"
edition = "2021"
rust-version = "1.85.1"
license = "AGPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
rusqlite = { version = "=0.32.1", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = "=2.1.1"
zeroize = "=1.8.1"
uuid = { version = "1", features = ["serde", "v4"] }
thiserror = "2"
