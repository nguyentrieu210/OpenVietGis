[package]
name = "ovg-project-store"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"

[workspace]

[dependencies]
rusqlite = { version = "=0.32.1", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
ovg-spatial = { git = "https://github.com/nguyentrieu210/OpenVietGis", rev = "b2c7a1fcbf80ae0da70a4c8e495efd25f2cb3517" }
ovg-mobile-engine = { git = "https://github.com/nguyentrieu210/OpenVietGis", rev = "b2c7a1fcbf80ae0da70a4c8e495efd25f2cb3517" }

tempfile = "3"
ovg-local-storage = { git = "https://github.com/nguyentrieu210/OpenVietGis", rev = "b2c7a1fcbf80ae0da70a4c8e495efd25f2cb3517" }
geo = { version = "=0.31.0", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
chacha20poly1305 = "=0.10.1"
zeroize = "=1.8.1"
