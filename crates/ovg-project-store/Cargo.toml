[package]
name = "ovg-project-store"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"

[workspace]

[dependencies]
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
ovg-spatial = { git = "https://github.com/nguyentrieu210/OpenVietGis", rev = "2acf58d897bb093966f18639d087ef904a72a720" }
ovg-mobile-engine = { git = "https://github.com/nguyentrieu210/OpenVietGis", rev = "2acf58d897bb093966f18639d087ef904a72a720" }

[dev-dependencies]
tempfile = "3"
