[package]
name = "ovg-local-storage"
version = "0.2.0"
edition = "2021"
rust-version = "1.85.1"
license = "AGPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
rusqlite = { version = "=0.32.1", features = ["bundled", "functions", "backup"] }
ovg-spatial = { path = "../ovg-spatial" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
