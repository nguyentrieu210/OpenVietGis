[package]
name = "ovg-mobile-ffi"
version = "0.2.0"
edition = "2021"
rust-version = "1.85.1"
license = "AGPL-3.0-or-later"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
ovg-project-store = { git = "https://github.com/nguyentrieu210/OpenVietGis", rev = "b7893d9f655da09666c030bf95a6a593926f9cf7" }
flutter_rust_bridge = "=2.11.1"
ovg-mobile-engine = { path = "../ovg-mobile-engine" }
ovg-local-storage = { path = "../ovg-local-storage" }
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
zeroize = "=1.8.1"
chacha20poly1305 = "=0.10.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# Temporary cross-PR source convergence. Remove git pin after both branches integrate.
[patch."https://github.com/nguyentrieu210/OpenVietGis"]
ovg-mobile-engine = { path = "../ovg-mobile-engine" }
ovg-local-storage = { path = "../ovg-local-storage" }
ovg-spatial = { path = "../ovg-spatial" }

[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.21.1"
