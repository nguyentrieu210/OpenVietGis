[package]
name = "ovg-mobile-ffi"
version = "0.2.0"
edition = "2021"
rust-version = "1.85.1"
license = "AGPL-3.0-or-later"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
ovg-mobile-engine = { path = "../ovg-mobile-engine" }
ovg-local-storage = { path = "../ovg-local-storage" }
uuid = { version = "1", features = ["v4"] }
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
