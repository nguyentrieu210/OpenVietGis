# Proposed, unapproved small-team self-host fixture. See README.md.
# No default production credentials or public plaintext HTTP listener.
x-app-environment: &app-environment
  OPENVIETGIS_ENVIRONMENT: production
  OPENVIETGIS_DATABASE_URL: ${RUNTIME_DATABASE_URL:?set RUNTIME_DATABASE_URL}
  OPENVIETGIS_RUNTIME_DATABASE_URL: ${RUNTIME_DATABASE_URL:?set RUNTIME_DATABASE_URL}
  OPENVIETGIS_APPLICATION_SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
  OPENVIETGIS_CSRF_SECRET: ${CSRF_SECRET:?set CSRF_SECRET}
  OPENVIETGIS_BOOTSTRAP_SECRET: ${BOOTSTRAP_SECRET:?set BOOTSTRAP_SECRET}
  OPENVIETGIS_SESSION_COOKIE_SECURE: "true"
  OPENVIETGIS_WEB_BASE_URL: ${PUBLIC_HTTPS_ORIGIN:?set PUBLIC_HTTPS_ORIGIN}
  OPENVIETGIS_API_PUBLIC_BASE_URL: ${PUBLIC_HTTPS_ORIGIN:?set PUBLIC_HTTPS_ORIGIN}
  OPENVIETGIS_OIDC_PROVIDERS: ${OIDC_PROVIDERS_JSON:?configure independent HTTPS OIDC provider}
  OPENVIETGIS_ARTIFACT_STORE_DIR: /var/lib/openvietgis/artifacts
  OPENVIETGIS_INVITATION_WEB_PATH: /app

services:
  postgres:
    build:
      context: ../..
      dockerfile: infra/prod/Dockerfile.postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openvietgis}
      POSTGRES_USER: ${POSTGRES_USER:-openvietgis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?set RUNTIME_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      # TCP prevents the temporary initialization server from appearing healthy.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-openvietgis} -d ${POSTGRES_DB:-openvietgis}"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ../..
      dockerfile: infra/prod/Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        /app/apps/api/.venv/bin/alembic -c /app/apps/api/alembic.ini upgrade head
        /app/apps/api/.venv/bin/python /app/tools/migrate_official_modules.py
    environment:
      <<: *app-environment
      OPENVIETGIS_MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?set MIGRATION_DATABASE_URL}
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infra/prod/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: *app-environment
    volumes:
      - artifacts:/var/lib/openvietgis/artifacts
    healthcheck:
      test: ["CMD", "/app/apps/api/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ops/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ../..
      dockerfile: infra/prod/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"

volumes:
  pgdata:
  artifacts:
