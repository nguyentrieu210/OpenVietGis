map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;

    # Aggregate process metrics are for the internal API scraper only.
    # Public ingress must not expose operational memory or request counters.
    location = /api/v1/ops/metrics {
        return 404;
    }

    location ^~ /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The entry shell and worker must revalidate on releases. Hashed Vite assets
    # can remain immutable; do not apply that policy to arbitrary .mjs URLs.
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /offline-shell-sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # Allow the dedicated .mjs MIME location below to match Vite workers.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /brand/ {
        try_files $uri =404;
    }

    location ~* ^/assets/[^/]+\.mjs$ {
        try_files $uri =404;
        types {
            application/javascript mjs;
        }
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.mjs$ {
        try_files $uri =404;
        types { application/javascript mjs; }
        default_type application/javascript;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
