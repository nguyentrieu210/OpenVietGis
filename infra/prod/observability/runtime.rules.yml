# Aggregate operational metrics. No organization, project, user, or route labels.
# Load into a private Prometheus instance only; the API metrics endpoint must
# not be published to the Internet. All rates use a five-minute window.
groups:
  - name: openvietgis-runtime
    interval: 30s
    rules:
      - record: ovg:http_request_duration_seconds:p95_5m
        expr: histogram_quantile(0.95, sum by (le) (rate(ovg_http_request_duration_seconds_bucket[5m])))
      - record: ovg:http_request_duration_seconds:p99_5m
        expr: histogram_quantile(0.99, sum by (le) (rate(ovg_http_request_duration_seconds_bucket[5m])))
      - record: ovg:http_requests:rate5m
        expr: sum(rate(ovg_http_requests_total[5m]))
      - record: ovg:http_errors:ratio5m
        expr: sum(rate(ovg_http_requests_5xx_total[5m])) / sum(rate(ovg_http_requests_total[5m]))
      - record: ovg:process_resident_memory_bytes:max
        expr: max(ovg_process_resident_memory_bytes)
      - record: ovg:tile_cache_hits:ratio5m
        expr: sum(rate(ovg_tile_cache_hits_total[5m])) / (sum(rate(ovg_tile_cache_hits_total[5m])) + sum(rate(ovg_tile_cache_misses_total[5m])) + sum(rate(ovg_tile_cache_bypasses_total[5m])))
      - record: ovg:tile_cache_bytes:sum
        expr: sum(ovg_tile_cache_bytes)
      - record: ovg:tile_cache_capacity_bytes:sum
        expr: sum(ovg_tile_cache_capacity_bytes)
      - record: ovg:tile_cache_abandoned:rate5m
        expr: sum(rate(ovg_tile_cache_abandoned_total[5m]))
