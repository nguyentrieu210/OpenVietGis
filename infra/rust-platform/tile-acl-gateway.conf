# Spec 064 Tile ACL Reverse-Proxy Gateway (T004 / FR-003 / FR-006 / SC-002)
#
# Fail-closed architecture:
# - Clients NEVER reach Martin directly.
# - Every request under /api/v1/tiles/ triggers an internal `auth_request` to `api-rust`
#   at /_internal/tiles/authorize, forwarding session cookies / Bearer auth / original URI.
# - If api-rust returns 401/403/5xx, Nginx rejects the tile request immediately (fail closed).
# - On 200 OK, api-rust returns verified scope & revision headers:
#     X-OVG-Org-Id, X-OVG-Project-Id, X-OVG-Authz-Version, X-OVG-Layer-Revision, X-OVG-Tile-Token
# - Tile micro-cache key includes org_id + project_id + authz_version + layer_revision + URI,
#   guaranteeing immediate cache invalidation on permission revocation or feature revision change.

proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=ovg_tiles:16m max_size=64m inactive=10m use_temp_path=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream ovg_api_rust {
    server api-rust:8080;
    keepalive 16;
}

upstream ovg_martin_internal {
    server martin:3000;
    keepalive 8;
}

server {
    listen 8080;
    server_name _;

    server_tokens off;
    client_max_body_size 100m;

    # Local gateway liveness probe (no DB/tile leak)
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Internal-only authorization subrequest endpoint (unreachable from external clients)
    location = /_internal/tiles/authorize {
        internal;
        proxy_pass http://ovg_api_rust/api/v1/internal/tiles/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # Authorized MVT tile endpoints -> fail-closed auth_request -> internal Martin
    location ^~ /api/v1/tiles/ {
        # Strip any client-spoofed internal headers before auth_request
        proxy_set_header X-OVG-Org-Id "";
        proxy_set_header X-OVG-Project-Id "";
        proxy_set_header X-OVG-Authz-Version "";
        proxy_set_header X-OVG-Layer-Revision "";
        proxy_set_header X-OVG-Tile-Token "";

        auth_request /_internal/tiles/authorize;
        auth_request_set $ovg_org_id $upstream_http_x_ovg_org_id;
        auth_request_set $ovg_project_id $upstream_http_x_ovg_project_id;
        auth_request_set $ovg_authz_version $upstream_http_x_ovg_authz_version;
        auth_request_set $ovg_layer_revision $upstream_http_x_ovg_layer_revision;
        auth_request_set $ovg_tile_token $upstream_http_x_ovg_tile_token;

        # Refuse if authorization service omitted mandatory tenant scope headers
        if ($ovg_org_id = "") {
            return 403;
        }
        if ($ovg_tile_token = "") {
            return 403;
        }

        # Rewrite /api/v1/tiles/<source>/<z>/<x>/<y> -> /internal-tiles/<source>/<z>/<x>/<y>
        rewrite ^/api/v1/tiles/(.*)$ /internal-tiles/$1 break;

        proxy_pass http://ovg_martin_internal;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Inject gateway-verified tenant scope & revision parameters for Martin SQL function
        proxy_set_header X-OVG-Org-Id $ovg_org_id;
        proxy_set_header X-OVG-Project-Id $ovg_project_id;
        proxy_set_header X-OVG-Authz-Version $ovg_authz_version;
        proxy_set_header X-OVG-Layer-Revision $ovg_layer_revision;
        proxy_set_header X-OVG-Tile-Token $ovg_tile_token;

        # Scoped cache key: any revocation (authz_version) or edit (layer_revision) busts cache
        proxy_cache ovg_tiles;
        proxy_cache_key "$ovg_org_id:$ovg_project_id:$ovg_authz_version:$ovg_layer_revision:$uri:$args";
        proxy_cache_valid 200 204 5m;
        proxy_cache_valid 401 403 404 0s;
        proxy_cache_lock on;
        proxy_cache_use_stale off;

        # Never allow shared public CDN caching of private tenant tiles
        add_header Cache-Control "private, no-store, must-revalidate" always;
        add_header Vary "Authorization, Cookie" always;
        add_header X-OVG-Tile-Cache $upstream_cache_status always;
    }

    # Block any direct probing of Martin internal paths
    location ^~ /internal-tiles/ {
        return 404;
    }

    # All other API / SSE / WebSocket traffic proxies to api-rust
    location ^~ /api/ {
        proxy_pass http://ovg_api_rust;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}