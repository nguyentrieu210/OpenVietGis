# Spec 064 hybrid staging ingress. Keep the FastAPI default for retained workflows.
map $http_upgrade $ovg_connection {
    default upgrade;
    '' '';
}

# Match the same raw URI that is passed to the chosen upstream.
# Changeset writes stay with the transactional FastAPI realtime producers.
# FastAPI owns HEAD semantics on existing routes. Only native tiles add HEAD.
map "$request_method:$request_uri" $ovg_candidate {
    default ovg_fastapi;
    # E08 is retired in FastAPI. Every credential type and method belongs to Rust.
    ~^[A-Z]+:/api/v1/organizations/[^/?]+/projects/[^/?]+/(?:processing|pro)(?:/|[?]|$) native_e08;
    ~^GET:/api/v1/(?:me|me/organizations|me/identity-links|me/avatar|auth/csrf|bootstrap/status)(?:[?].*)?$ session;
    "~^GET:/api/v1/organizations/[0-9A-Fa-f-]+/projects/[0-9A-Fa-f-]+/(?:layers(?:/[0-9A-Fa-f-]+(?:/features(?:/[A-Za-z0-9_-]{1,128})?|/viewport|/display-extent)?)?|spatial/(?:sources(?:/[0-9A-Fa-f-]+)?|crs-profiles))(?:[?].*)?$" session;
    ~^(?:GET|HEAD):/api/v1/organizations/[0-9A-Fa-f-]+/projects/[0-9A-Fa-f-]+/layers/[0-9A-Fa-f-]+/tiles/[0-9]+/[0-9]+/[0-9]+[.]mvt(?:[?].*)?$ native_tile;
    ~^POST:/api/v1/organizations/[0-9A-Fa-f-]+/projects/[0-9A-Fa-f-]+/layers/[0-9A-Fa-f-]+/query(?:[?].*)?$ session;
    ~^(?:GET|POST):/api/v1/organizations/[0-9A-Fa-f-]+/projects/[0-9A-Fa-f-]+/saved-queries(?:[?].*)?$ session;
    ~^DELETE:/api/v1/organizations/[0-9A-Fa-f-]+/projects/[0-9A-Fa-f-]+/saved-queries/[0-9A-Fa-f-]+(?:[?].*)?$ session;
    ~^GET:/api/v1/organizations/[0-9A-Fa-f-]+/projects/[0-9A-Fa-f-]+/sources/[0-9A-Fa-f-]+/changesets(?:[?].*)?$ session;
    ~^GET:/api/v1/organizations/[0-9A-Fa-f-]+/projects/[0-9A-Fa-f-]+/changesets/[0-9A-Fa-f-]+(?:[?].*)?$ session;
    ~^POST:/api/v1/organizations/[0-9A-Fa-f-]+/projects/[0-9A-Fa-f-]+/editing/snap(?:[?].*)?$ session;
    # E18: release inventory and entitlements are Rust-owned. Health, readiness and metrics stay
    # on FastAPI so gateway probes and scrapes still see the retained Python service.
    ~^GET:/api/v1/ops/release-capabilities(?:[?].*)?$ session;
    ~^(?:GET|PUT):/api/v1/organizations/[0-9A-Fa-f-]+/ops/entitlement(?:[?].*)?$ session;
}

# Preserve legacy bearer callers on existing routes until Rust support is equivalent.
map "$ovg_candidate:$http_authorization" $ovg_backend {
    default ovg_fastapi;
    "session:" ovg_rust;
    ~^native_tile: ovg_rust;
    ~^native_e08: ovg_rust;
}

upstream ovg_fastapi {
    server api-python:8000;
    keepalive 16;
}
upstream ovg_rust {
    server api-rust:8080;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 100m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /api/ {
        proxy_pass http://$ovg_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ovg_connection;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
