# Isolated hybrid staging. Build both pinned application images from the same revision.
name: ovg-064-hybrid-staging

x-shared-environment: &shared-environment
  OPENVIETGIS_SESSION_COOKIE_SECURE: "true"
  OPENVIETGIS_WEB_BASE_URL: "${STAGING_WEB_ORIGIN:?set STAGING_WEB_ORIGIN}"
  OPENVIETGIS_API_PUBLIC_BASE_URL: "${STAGING_WEB_ORIGIN:?set STAGING_WEB_ORIGIN}"
  OPENVIETGIS_APPLICATION_SESSION_SECRET: "${STAGING_SESSION_SECRET:?set STAGING_SESSION_SECRET}"
  OPENVIETGIS_CSRF_SECRET: "${STAGING_CSRF_SECRET:?set STAGING_CSRF_SECRET}"
  OPENVIETGIS_ARTIFACT_STORE_DIR: /var/lib/openvietgis/artifacts

x-python-environment: &python-environment
  <<: *shared-environment
  OPENVIETGIS_ENVIRONMENT: production
  OPENVIETGIS_BOOTSTRAP_SECRET: "${STAGING_BOOTSTRAP_SECRET:?set STAGING_BOOTSTRAP_SECRET}"
  OPENVIETGIS_DATABASE_URL: "${STAGING_RUNTIME_DATABASE_URL:?set STAGING_RUNTIME_DATABASE_URL}"
  OPENVIETGIS_RUNTIME_DATABASE_URL: "${STAGING_RUNTIME_DATABASE_URL:?set STAGING_RUNTIME_DATABASE_URL}"
  OPENVIETGIS_OIDC_PROVIDERS: "${STAGING_OIDC_PROVIDERS_JSON:?set STAGING_OIDC_PROVIDERS_JSON}"

services:
  postgres-staging:
    image: "${OVG_STAGING_POSTGIS_IMAGE:?set OVG_STAGING_POSTGIS_IMAGE}"
    shm_size: 256m
    mem_limit: 768m
    memswap_limit: 768m
    cpus: "1.0"
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=48"]
    environment:
      POSTGRES_DB: ovg_staging_064
      POSTGRES_USER: openvietgis
      POSTGRES_PASSWORD: "${STAGING_POSTGRES_PASSWORD:?set STAGING_POSTGRES_PASSWORD}"
      STAGING_RUNTIME_PASSWORD: "${STAGING_RUNTIME_PASSWORD:?set STAGING_RUNTIME_PASSWORD}"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [data]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "openvietgis", "-d", "ovg_staging_064"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: "${OVG_API_PYTHON_IMAGE:?set OVG_API_PYTHON_IMAGE}"
    environment:
      <<: *python-environment
      OPENVIETGIS_MIGRATION_DATABASE_URL: "${STAGING_MIGRATION_DATABASE_URL:?set STAGING_MIGRATION_DATABASE_URL}"
    command:
      - /bin/sh
      - -ec
      - |
        /app/apps/api/.venv/bin/alembic -c /app/apps/api/alembic.ini upgrade head
        /app/apps/api/.venv/bin/python /app/tools/migrate_official_modules.py
    depends_on:
      postgres-staging:
        condition: service_healthy
    networks: [data]
    mem_limit: 384m
    memswap_limit: 384m
    cpus: "0.75"

  api-python:
    image: "${OVG_API_PYTHON_IMAGE:?set OVG_API_PYTHON_IMAGE}"
    environment: *python-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - python-artifacts:/var/lib/openvietgis/artifacts
    networks: [data, ingress]
    mem_limit: 384m
    memswap_limit: 384m
    cpus: "0.75"
    healthcheck:
      test: ["CMD", "/app/apps/api/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ops/health/ready', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 10

  api-rust:
    image: "${OVG_API_RUST_IMAGE:?set OVG_API_RUST_IMAGE}"
    environment:
      <<: *shared-environment
      OPENVIETGIS_DATABASE_URL: "${STAGING_RUST_DATABASE_URL:?set STAGING_RUST_DATABASE_URL}"
      OPENVIETGIS_BIND_ADDR: 0.0.0.0:8080
      OPENVIETGIS_DB_MAX_CONNECTIONS: "12"
      OVG_CORS_ORIGINS: "${STAGING_WEB_ORIGIN:?set STAGING_WEB_ORIGIN}"
      TOKIO_WORKER_THREADS: "2"
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - rust-artifacts:/var/lib/openvietgis/artifacts
    networks: [data, ingress]
    read_only: true
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=32m,noexec,nosuid"]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1:8080/api/v1/ops/health/ready"]
      interval: 10s
      timeout: 6s
      retries: 10

  gateway:
    image: nginx:1.26-alpine
    depends_on:
      api-python:
        condition: service_healthy
      api-rust:
        condition: service_healthy
    ports:
      - "127.0.0.1:${STAGING_EDGE_PORT:-18064}:8080"
    volumes:
      - ./hybrid-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [ingress]
    mem_limit: 96m
    memswap_limit: 96m
    cpus: "0.25"

networks:
  data:
    internal: true
  ingress: {}

volumes:
  postgres-data:
  python-artifacts:
  rust-artifacts:
