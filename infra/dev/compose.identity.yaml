services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HEALTH_ENABLED: "true"
      KC_PROXY_HEADERS: "xforwarded"
      KC_BOOTSTRAP_ADMIN_USERNAME: openvietgis-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: openvietgis-development-only
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./keycloak/realm-openvietgis.json:/opt/keycloak/data/import/realm-openvietgis.json:ro
      - ./keycloak/themes/openvietgis:/opt/keycloak/themes/openvietgis:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3; cat <&3 | grep -q '200 OK'"
        ]
      interval: 5s
      timeout: 3s
      retries: 30
