<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <include>/etc/fonts/fonts.conf</include>
  <!-- Match the font set used to capture the Linux baselines. Playwright
       installs these families through its Chromium system dependencies. -->
  <reset-dirs />
  <dir>/usr/share/fonts/truetype/liberation</dir>
  <dir>/usr/share/fonts/truetype/liberation2</dir>
  <dir>/usr/share/fonts/truetype/wqy</dir>
  <dir>/usr/share/fonts/truetype/freefont</dir>
  <dir>/usr/share/fonts/truetype/noto</dir>
  <dir>/usr/share/fonts/opentype/ipafont-gothic</dir>
  <dir>/usr/share/fonts/opentype/tlwg</dir>
  <dir>/usr/share/fonts/opentype/unifont</dir>
  <dir>/usr/share/fonts/X11/Type1</dir>
</fontconfig>
